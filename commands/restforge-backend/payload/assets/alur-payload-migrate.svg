<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="200" fill="#ffffff"/>
  <defs>
    <marker id="panah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- kotak 1: RDF -->
  <rect x="20" y="50" width="200" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">payload/</text>
  <text x="120" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">visitors.json</text>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#475569">RDF, ber-JOIN</text>

  <!-- panah 1 -->
  <line x1="222" y1="100" x2="338" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#panah)"/>
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">payload migrate</text>

  <!-- kotak 2: UDF -->
  <rect x="340" y="30" width="270" height="140" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="475" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">frontend/payload/</text>
  <text x="475" y="92" text-anchor="middle" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">app-config.json</text>
  <text x="475" y="112" text-anchor="middle" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">pages\*.json</text>
  <text x="475" y="132" text-anchor="middle" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">visitors-app.json</text>
  <text x="475" y="154" text-anchor="middle" font-size="12" fill="#475569">aggregator (UDF)</text>

  <!-- panah 2 -->
  <line x1="612" y1="100" x2="738" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#panah)"/>
  <text x="675" y="82" text-anchor="middle" font-size="11" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">npx restforge-designer</text>
  <text x="675" y="96" text-anchor="middle" font-size="11" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">generate</text>

  <!-- kotak 3: build -->
  <rect x="740" y="50" width="240" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="860" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">./build/</text>
  <text x="860" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="Consolas, 'Courier New', monospace">visitors-app/</text>
  <text x="860" y="132" text-anchor="middle" font-size="12" fill="#475569">HTML, JS, CSS</text>
</svg>
