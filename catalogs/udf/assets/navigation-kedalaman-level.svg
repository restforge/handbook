<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="560" height="200" fill="#ffffff"/>

  <!-- Level 1 -->
  <rect x="20" y="20" width="300" height="40" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="36" y="45" font-size="14" fill="#111827" font-weight="600">Level 1</text>
  <text x="100" y="45" font-size="14" fill="#111827">Item top-level (dengan icon)</text>

  <!-- Level 2 -->
  <rect x="80" y="80" width="300" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="96" y="105" font-size="14" fill="#111827" font-weight="600">Level 2</text>
  <text x="160" y="105" font-size="14" fill="#111827">Child dari group level 1</text>

  <!-- Level 3 -->
  <rect x="140" y="140" width="300" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="156" y="165" font-size="14" fill="#111827" font-weight="600">Level 3</text>
  <text x="220" y="165" font-size="14" fill="#111827">Child dari group level 2</text>

  <!-- Penghubung -->
  <path d="M50 60 V100 H80" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M110 120 V160 H140" fill="none" stroke="#4b5563" stroke-width="1.5"/>

  <text x="460" y="45" font-size="12" fill="#4b5563">icon dirender</text>
  <text x="460" y="105" font-size="12" fill="#4b5563">tanpa icon</text>
  <text x="460" y="165" font-size="12" fill="#4b5563">tanpa icon</text>
</svg>
